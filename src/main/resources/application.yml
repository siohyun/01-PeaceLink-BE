server:
  port: ${PORT:8080}

spring:
  application:
    name: our-backend-project

  datasource:
    url: ${DB_HOST}
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  task:
    scheduling:
      enabled: true

huggingface:
  api:
    token: ${HUGGINGFACE_API_TOKEN:mock_token_value} # 띄어쓰기 있던 철자 수정
  model:
    id: ${HUGGINGFACE_MODEL_ID:seohyun01/peacelink-gemma-medical}

stt:
  noise:
    threshold: ${STT_NOISE_THRESHOLD:0.4}
  whisper:
    api:
      url: ${STT_WHISPER_API_URL:https://api-inference.huggingface.co/models/openai/whisper-large-v3}

public-data:
  service-key: ${PUBLIC_DATA_SERVICE_KEY}
  shelter:
    url: https://apis.data.go.kr/1741000/civil_defense_shelter_info/info
    page-size: 10
  disaster-msg:
    url: https://apis.data.go.kr/1741000/DisasterMsg3/getDisasterMsg1List

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}
  mobility-url: https://apis-navi.kakaomobility.com/v1/directions

osrm:
  url: ${OSRM_URL:http://router.project-osrm.org/route/v1/foot}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

safetydata:
  service-key: ${SAFETYDATA_SERVICE_KEY}

gemini:
  api-key: ${GEMINI_API_KEY}

aws:
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_S3_REGION}