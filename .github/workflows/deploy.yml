name: Peacelink Backend CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Install Railway CLI & Deploy
        run: |
          npm install -g @railway/cli
          railway up --service=peacelink-backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }} # 3단계에서 세팅할 비밀키